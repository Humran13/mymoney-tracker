{% extends "base/base.html" %}
{% block title %}Check your email · {{ APP_NAME }}{% endblock %}
{% block guest_content %}
<div class="w-full max-w-sm bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8 text-center">
  <h1 class="text-xl font-bold mb-2">Check your email</h1>
  <p class="text-sm text-slate-500">If an account exists with that email, a password reset link has been sent.</p>
  <a href="{% url 'users:login' %}" class="inline-block mt-6 text-brand-600 font-medium">Back to login</a>
</div>
{% endblock %}
