{% extends "base/base.html" %}
{% block title %}Password reset · {{ APP_NAME }}{% endblock %}
{% block guest_content %}
<div class="w-full max-w-sm bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8 text-center">
  <h1 class="text-xl font-bold mb-2">Password updated</h1>
  <p class="text-sm text-slate-500">You can now log in with your new password.</p>
  <a href="{% url 'users:login' %}" class="inline-block mt-6 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg py-2.5 px-6">Log in</a>
</div>
{% endblock %}
