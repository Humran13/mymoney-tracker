<header class="h-16 flex items-center justify-between gap-3 px-4 sm:px-6 border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">
  <button type="button" @click="mobileNavOpen = true" class="md:hidden p-2 -ml-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700" aria-label="Open menu">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
  </button>
  <div class="md:hidden text-brand-600 dark:text-brand-500 font-bold">MyMoney</div>
  <div class="flex-1"></div>
  <div class="flex items-center gap-3" x-data="{open:false}">
    <button type="button" @click="document.documentElement.classList.toggle('dark'); localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light'"
            class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700" title="Toggle theme">🌓</button>
    <button type="button" @click="open = !open" class="flex items-center gap-2 text-sm font-medium" aria-label="Open user menu">
      <span class="w-8 h-8 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center">{{ user.email|slice:":1"|upper }}</span>
      <span class="hidden sm:inline">{{ user.get_short_name }}</span>
    </button>
    <div x-show="open" @click.outside="open=false" x-cloak class="absolute right-4 top-14 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg w-48 py-1 text-sm z-20">
      <a href="{% url 'users:profile' %}" class="block px-4 py-2 hover:bg-slate-50 dark:hover:bg-slate-700">Profile</a>
      <a href="{% url 'users:password_change' %}" class="block px-4 py-2 hover:bg-slate-50 dark:hover:bg-slate-700">Change password</a>
      <form method="post" action="{% url 'users:logout' %}">
        {% csrf_token %}
        <button type="submit" class="w-full text-left block px-4 py-2 hover:bg-slate-50 dark:hover:bg-slate-700">Logout</button>
      </form>
    </div>
  </div>
</header>
