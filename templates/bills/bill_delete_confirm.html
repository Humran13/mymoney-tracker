{% extends "base/base.html" %}
{% block title %}Delete bill · {{ APP_NAME }}{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-4">Delete "{{ bill.name }}"?</h1>
<div class="bg-white dark:bg-slate-800 rounded-2xl border border-red-200 p-6 max-w-lg">
  <p class="text-sm mb-4">Past payments and transactions already recorded for this bill are kept; only the recurring schedule is removed.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg px-5 py-2.5">Delete</button>
    <a href="{% url 'bills:list' %}" class="ml-3 text-sm text-slate-500">Cancel</a>
  </form>
</div>
{% endblock %}
