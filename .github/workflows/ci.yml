name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Test-only credentials for the ephemeral CI database — never real secrets,
  # and this workflow never touches a production database.
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-use
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_DEBUG: "true"
  DATABASE_URL: postgres://mymoney:ci-test-password@localhost:5432/mymoney_ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.4
      - run: ruff check .

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - name: Python dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend dependency vulnerability scan
        run: npm audit

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build:css
      - name: Verify the compiled stylesheet was actually produced
        run: test -s static/css/tailwind.css

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mymoney_ci
          POSTGRES_USER: mymoney
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build:css

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium

      - name: Django system checks
        run: python manage.py check

      - name: Migration check (no missing migrations)
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations against real PostgreSQL
        run: python manage.py migrate --no-input

      - name: Collect static files (verifies whitenoise/staticfiles config)
        run: DJANGO_SECRET_KEY=ci-build-only python manage.py collectstatic --no-input

      - name: Run full test suite (unit + browser E2E) against PostgreSQL
        # --ds overrides pytest.ini's config.settings.test (SQLite, for fast
        # local runs) so CI genuinely exercises PostgreSQL end to end.
        run: pytest tests/ --ds=config.settings.dev --browser chromium -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (no push)
        run: docker build -t mymoney-tracker:ci .
